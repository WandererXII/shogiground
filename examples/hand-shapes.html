<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hand shape geometry regression</title>
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      body { font: 16px sans-serif; }
      #fixture { position: relative; height: 580px; }
      #board { position: absolute; left: 230px; top: 20px; width: 360px; height: 400px; }
      #hand { position: absolute; left: 20px; top: 100px; width: 180px; height: 180px; }
      #fixture sg-hand piece { width: 40px; height: 44px; }
    </style>
  </head>
  <body class="demo-hands">
    <h1>Hand shape geometry regression</h1>
    <p>Run <code>pnpm compile</code> before opening this page.</p>
    <button id="run">Run tests</button>
    <pre id="results"></pre>
    <div id="fixture"></div>
    <script type="module">
      import { Shogiground } from '../esm/shogiground.js';

      const fixture = document.querySelector('#fixture');
      const results = document.querySelector('#results');
      const pawn = { color: 'sente', role: 'pawn' };
      const shapes = [
        { orig: pawn, dest: '5e', brush: 'alternative0' },
        { orig: '5e', dest: pawn, brush: 'alternative1' },
        { orig: pawn, dest: pawn, brush: 'alternative2' },
        { orig: '7g', dest: '7f', brush: 'primary' },
      ];
      const frame = () => new Promise(requestAnimationFrame);
      const assert = (value, message) => { if (!value) throw new Error(message); };

      async function setup(attachHand = true) {
        fixture.innerHTML = '<div id="board" class="sg-wrap"></div><div id="hand" class="sg-hand-wrap"></div>';
        const board = fixture.querySelector('#board');
        const hand = fixture.querySelector('#hand');
        const api = Shogiground({
          animation: { enabled: false },
          hands: { inlined: false },
          drawable: { shapes },
        }, { board, hands: attachHand ? { bottom: hand } : undefined });
        await frame();
        const line = (brush) => board.querySelector(`.sg-shapes > g > .${brush} line`);
        const ellipse = () => board.querySelector('.sg-shapes > g > .alternative2 ellipse');
        // Simulate the bounds invalidation that accompanies resize/scroll, then render.
        const redraw = () => {
          api.state.dom.bounds.board.bounds.clear();
          api.state.dom.bounds.hands.bounds.clear();
          api.state.dom.bounds.hands.pieceBounds.clear();
          api.state.dom.redrawNow();
        };
        return { api, board, hand, line, ellipse, redraw };
      }

      const tests = [
        ['hand movement updates both arrow endpoints', async (f) => {
          const orig = f.line('alternative0').getAttribute('x1');
          const dest = f.line('alternative1').getAttribute('x2');
          const boardShape = f.line('primary');
          f.hand.style.left = '60px';
          f.redraw();
          assert(f.line('alternative0').getAttribute('x1') !== orig, 'hand origin stayed stale');
          assert(f.line('alternative1').getAttribute('x2') !== dest, 'hand destination stayed stale');
          assert(f.line('primary') === boardShape, 'board-only arrow was needlessly replaced');
        }],
        ['hand resizing updates geometry through ResizeObserver', async (f) => {
          const before = f.line('alternative0').getAttribute('x1');
          f.hand.style.width = '210px';
          // Allow layout, the observer, and its scheduled redraw to complete.
          for (let i = 0; i < 4; i++) await frame();
          assert(f.line('alternative0').getAttribute('x1') !== before, 'hand resize stayed stale');
        }],
        ['piece resizing about its center updates the hand circle', async (f) => {
          const before = f.ellipse().getAttribute('ry');
          const piece = [...f.hand.querySelectorAll('piece')].find((el) => el.sgRole === 'pawn');
          piece.style.transform = 'scale(1.5)';
          f.redraw();
          assert(f.ellipse().getAttribute('ry') !== before, 'hand circle size stayed stale');
        }],
        ['board movement with unchanged dimensions updates hand geometry', async (f) => {
          const before = f.line('alternative0').getAttribute('x1');
          f.board.style.left = '260px';
          f.redraw();
          assert(f.line('alternative0').getAttribute('x1') !== before, 'relative position stayed stale');
        }],
        ['unchanged bounds retain existing SVG elements', async (f) => {
          const before = f.line('alternative0');
          f.redraw();
          assert(f.line('alternative0') === before, 'unchanged shape was replaced');
        }],
        ['attaching a missing hand restores both arrows', async (f) => {
          assert(!f.line('alternative0') && !f.line('alternative1'), 'unexpected initial hand arrows');
          f.api.attach({ hands: { bottom: f.hand } });
          await frame();
          assert(f.line('alternative0') && f.line('alternative1'), 'arrows missing after attachment');
        }, false],
      ];

      async function run() {
        document.querySelector('#run').disabled = true;
        results.textContent = '';
        let passed = 0;
        for (const [name, test, attachHand] of tests) {
          const f = await setup(attachHand);
          try {
            await test(f);
            passed++;
            results.textContent += `PASS ${name}\n`;
          } catch (error) {
            results.textContent += `FAIL ${name}: ${error.message}\n`;
          } finally {
            f.api.destroy();
          }
        }
        results.textContent += `${passed}/${tests.length} passed`;
        document.querySelector('#run').disabled = false;
      }
      document.querySelector('#run').addEventListener('click', run);
      await run();
    </script>
  </body>
</html>
