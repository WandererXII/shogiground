<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Destroy interaction regression</title>
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body class="demo-hands">
    <button id="destroy">Destroy board</button>
    <button id="test">Run regression checks</button>
    <pre id="result">Right-click the board before and after destroying it. Reload for a fresh test.</pre>
    <div style="display: flex; gap: 20px">
      <div style="width: 360px; height: 393px"><div id="board" class="sg-wrap"></div></div>
      <div id="hand-top" class="sg-hand-wrap" style="width: 80px; height: 393px"></div>
      <div id="hand" class="sg-hand-wrap" style="width: 80px; height: 393px"></div>
    </div>
    <pre id="status"></pre>
    <script type="module">
      import { Shogiground } from '../esm/shogiground.js';

      // Track actual DOM registrations: inert handlers alone must not pass these checks.
      const listeners = new Map();
      const nativeAdd = EventTarget.prototype.addEventListener;
      const nativeRemove = EventTarget.prototype.removeEventListener;
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        if (!listeners.has(this)) listeners.set(this, new Map());
        const types = listeners.get(this);
        if (!types.has(type)) types.set(type, new Set());
        types.get(type).add(listener);
        return nativeAdd.call(this, type, listener, options);
      };
      EventTarget.prototype.removeEventListener = function(type, listener, options) {
        listeners.get(this)?.get(type)?.delete(listener);
        return nativeRemove.call(this, type, listener, options);
      };
      const listenerCount = (el) => [...(listeners.get(el)?.values() || [])]
        .reduce((count, callbacks) => count + callbacks.size, 0);

      const nativeFrame = window.requestAnimationFrame.bind(window);
      let frames = 0;
      window.requestAnimationFrame = (callback) => nativeFrame((time) => {
        frames++;
        callback(time);
      });
      const sg = Shogiground({ sfen: { hands: 'B' }, animation: { enabled: false } }, {
        board: document.querySelector('#board'),
        hands: { bottom: document.querySelector('#hand') },
      });
      const state = sg.state;
      const pieces = state.dom.elements.board.pieces;
      const promotion = state.dom.elements.board.promotion;
      const hand = state.dom.elements.hands.bottom;
      const result = document.querySelector('#result');
      const settle = async () => {
        for (let i = 0; i < 4; i++) await new Promise(nativeFrame);
      };
      const status = () => {
        document.querySelector('#status').textContent = JSON.stringify({
          destroyed: state.dom.destroyed,
          drawing: !!state.drawable.current,
          dragging: !!state.draggable.current,
          selected: state.selected,
          frames,
        });
      };
      setInterval(status, 100);
      document.querySelector('#destroy').onclick = () => sg.destroy();
      document.querySelector('#test').onclick = async () => {
        const results = [];
        let lifecycleGround;
        const check = (condition, message) => {
          if (!condition) throw new Error(message);
          results.push('PASS: ' + message);
        };
        const boardRect = pieces.getBoundingClientRect();
        const handPiece = hand.querySelector('piece');
        const handRect = handPiece.getBoundingClientRect();
        const mouse = (target, type, button, rect, extra = {}) => {
          const event = new MouseEvent(type, {
            bubbles: true, cancelable: true, button,
            clientX: rect.x + rect.width / 2, clientY: rect.y + rect.height / 2,
            ...extra,
          });
          target.dispatchEvent(event);
          return event;
        };
        const touch = (target, rect) => {
          const contact = new Touch({ identifier: 1, target,
            clientX: rect.x + rect.width / 2, clientY: rect.y + rect.height / 2 });
          target.dispatchEvent(new TouchEvent('touchstart', {
            bubbles: true, cancelable: true, touches: [contact], shiftKey: true,
          }));
        };
        try {
          check(!state.dom.destroyed, 'fresh board');
          check(listenerCount(pieces) === 3 && listenerCount(promotion) === 2 &&
            listenerCount(hand) === 4, 'live elements have exactly one set of handlers');
          mouse(pieces, 'mousedown', 2, boardRect);
          check(!!state.drawable.current, 'live board starts drawing');
          mouse(document, 'mouseup', 2, boardRect);
          check(!state.drawable.current, 'document release ends drawing');
          mouse(handPiece, 'mousedown', 2, handRect);
          check(!!state.drawable.current, 'live hand starts drawing');
          sg.destroy();
          check(!state.drawable.current, 'destroy cancels active drawing');
          check([pieces, promotion, hand].every(el => listenerCount(el) === 0),
            'destroy physically removes every element listener');
          check(state.dom.elementUnbinds.size === 0, 'destroy clears cleanup references');
          await settle();
          const stoppedFrames = frames;
          const inert = () => !state.drawable.current && !state.draggable.current &&
            !state.selected && !state.selectedPiece && !state.drawable.piece;
          for (const target of [pieces, handPiece]) {
            const rect = target === pieces ? boardRect : handRect;
            const name = target === pieces ? 'board' : 'hand';
            for (const button of [0, 1, 2]) {
              mouse(target, 'mousedown', button, rect);
              check(inert(), `destroyed ${name} ignores mouse button ${button}`);
            }
            mouse(target, 'mousedown', 0, rect, { shiftKey: true });
            check(inert(), `destroyed ${name} ignores shift-click`);
            touch(target, rect);
            check(inert(), `destroyed ${name} ignores touch input`);
            const context = mouse(target, 'contextmenu', 2, rect);
            check(!context.defaultPrevented, 'destroyed element permits context menu');
          }
          check(!mouse(promotion, 'contextmenu', 2, boardRect).defaultPrevented,
            'destroyed promotion permits context menu');
          let bubbled = false;
          pieces.parentElement.addEventListener('click', () => { bubbled = true; }, { once: true });
          mouse(promotion, 'click', 0, boardRect);
          check(bubbled, 'destroyed promotion click propagates');
          // Seed a pending promotion to prove retained hand clicks cannot mutate it.
          const pending = {};
          state.promotion.current = pending;
          mouse(handPiece, 'click', 0, handRect);
          check(state.promotion.current === pending, 'destroyed hand click is inert');
          state.promotion.current = undefined;
          await settle();
          check(frames === stoppedFrames, 'no animation frames scheduled after destroyed input');
          sg.destroy();
          check(state.dom.destroyed, 'repeated destruction is safe');

          const targets = {
            board: document.querySelector('#board'),
            hands: { top: document.querySelector('#hand-top'), bottom: document.querySelector('#hand') },
          };
          lifecycleGround = Shogiground({ sfen: { hands: 'Bb' }, animation: { enabled: false } }, targets);
          const liveState = lifecycleGround.state;
          const snapshot = () => {
            const els = liveState.dom.elements;
            return {
              board: [els.board?.pieces, els.board?.promotion].filter(Boolean),
              top: els.hands?.top,
              bottom: els.hands?.bottom,
            };
          };
          const removed = (nodes, name) => {
            check(nodes.every(el => listenerCount(el) === 0), `${name}: listeners removed`);
            for (const el of nodes) {
              mouse(el, 'mousedown', 2, boardRect);
              check(!liveState.drawable.current, `${name}: retained element cannot draw`);
              check(!mouse(el, 'contextmenu', 2, boardRect).defaultPrevented,
                `${name}: retained element permits context menu`);
            }
          };
          const live = () => {
            const els = liveState.dom.elements;
            const expected = liveState.viewOnly ? 0 : 1;
            check(listenerCount(els.board.pieces) === 3 * expected &&
              listenerCount(els.board.promotion) === 2 * expected &&
              listenerCount(els.hands.top) === 4 * expected &&
              listenerCount(els.hands.bottom) === 4 * expected,
              'current elements have mode-appropriate handlers without duplicates');
            check(liveState.dom.elementUnbinds.size === 3, 'only current elements retain cleanup callbacks');
            if (liveState.viewOnly) return;
            for (const el of [els.board.pieces, els.hands.top.querySelector('piece'),
              els.hands.bottom.querySelector('piece')]) {
              const rect = el.getBoundingClientRect();
              mouse(el, 'mousedown', 2, rect);
              check(!!liveState.drawable.current, 'current board or hand starts drawing');
              mouse(document, 'mouseup', 2, rect);
              check(!liveState.drawable.current, 'current drawing ends on release');
            }
          };
          live();
          let old = snapshot();
          lifecycleGround.attach({ board: targets.board });
          removed(old.board, 'board replacement');
          check(liveState.dom.elements.hands.top === old.top &&
            liveState.dom.elements.hands.bottom === old.bottom, 'board replacement preserves external hands');
          live();

          old = snapshot();
          lifecycleGround.attach({ hands: { bottom: targets.hands.bottom } });
          removed([old.bottom], 'partial hand replacement');
          check(liveState.dom.elements.hands.top === old.top, 'partial replacement preserves other hand');
          live();

          old = snapshot();
          lifecycleGround.detach({ hands: { bottom: true } });
          removed([old.bottom], 'hand detach');
          check(liveState.dom.elementUnbinds.size === 2, 'hand detach releases its cleanup reference');
          lifecycleGround.attach({ hands: { bottom: targets.hands.bottom } });
          live();

          old = snapshot();
          lifecycleGround.detach({ board: true });
          removed(old.board, 'board detach');
          check(liveState.dom.elementUnbinds.size === 2, 'board detach preserves external hand bindings');
          lifecycleGround.attach({ board: targets.board });
          live();

          for (const inlined of [true, false, true]) {
            old = snapshot();
            lifecycleGround.set({ hands: { inlined } });
            removed([...old.board, old.top, old.bottom], 'hand layout change');
            live();
          }
          old = snapshot();
          lifecycleGround.detach({ board: true });
          removed([...old.board, old.top, old.bottom], 'inline board detach');
          check(liveState.dom.elementUnbinds.size === 0, 'inline detach releases every cleanup reference');
          lifecycleGround.attach({ board: targets.board });
          live();

          for (const viewOnly of [true, false, true, false]) {
            old = snapshot();
            lifecycleGround.set({ viewOnly });
            removed([...old.board, old.top, old.bottom], 'view-only change');
            live();
          }
          old = snapshot();
          lifecycleGround.destroy();
          removed([...old.board, old.top, old.bottom], 'final destruction');
          lifecycleGround.attach(targets);
          lifecycleGround.toggleOrientation();
          check(liveState.dom.elements.board.pieces === old.board[0] &&
            liveState.dom.elementUnbinds.size === 0,
            'attachment and orientation changes cannot rebind a destroyed board');
          removed([...old.board, old.top, old.bottom], 'after destroyed attachment');
        } catch (error) {
          results.push('FAIL: ' + error.message);
        } finally {
          lifecycleGround?.destroy();
          sg.destroy();
          result.textContent = results.join('\n');
          status();
        }
      };
    </script>
  </body>
</html>
