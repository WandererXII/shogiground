<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Runtime configuration regression tests</title>
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      body { font-size: 14px; margin: 20px; }
      #fixture { display: flex; align-items: center; width: max-content; margin: 50px 20px; }
      #board { width: 396px; height: 432px; flex: none; }
      #board > .sg-hand-wrap { position: absolute; left: calc(100% + 16px); margin: 0; }
      #board > .hand-top { top: 0; }
      #board > .hand-bottom { bottom: 0; }
      #top:empty, #bottom:empty { visibility: hidden; }
      #results { white-space: pre-wrap; }
    </style>
  </head>
  <body class="demo-hands">
    <h1>Runtime configuration regression tests</h1>
    <p>Run <code>pnpm compile</code>, then serve the repository with live-server.</p>
    <button id="run">Run regression tests</button>
    <button id="reset">Reset interaction board</button>
    <button id="draw">Toggle drawing mode</button>
    <button id="inline">Toggle inline hands</button>
    <button id="view-only">Toggle view-only</button>
    <button id="interrupt">Rebuild during next gesture</button>
    <div id="fixture"><div id="top"></div><div id="board"></div><div id="bottom"></div></div>
    <output id="interaction"></output>
    <pre id="results"></pre>
    <script type="module">
      import { Shogiground } from '../esm/shogiground.js';
      import { promotionDialogMove } from '../esm/board.js';
      import { start as startDrawing } from '../esm/draw.js';
      import { start as startDragging } from '../esm/drag.js';

      const board = document.querySelector('#board');
      const top = document.querySelector('#top');
      const bottom = document.querySelector('#bottom');
      const results = document.querySelector('#results');
      const interaction = document.querySelector('#interaction');
      const observed = new Set();
      const NativeResizeObserver = window.ResizeObserver;
      window.ResizeObserver = class extends NativeResizeObserver {
        observe(el, options) { observed.add(el); super.observe(el, options); }
        unobserve(el) { observed.delete(el); super.unobserve(el); }
        disconnect() { observed.clear(); super.disconnect(); }
      };
      const TrackingResizeObserver = window.ResizeObserver;
      const documentEvents = ['touchmove', 'mousemove', 'touchend', 'mouseup', 'scroll'];
      const listeners = new Map([
        [document, new Map(documentEvents.map(type => [type, new Set()]))],
        [window, new Map([['resize', new Set()]])],
        [document.body, new Map([['shogiground.resize', new Set()]])],
      ]);
      const addEventListener = EventTarget.prototype.addEventListener;
      const removeEventListener = EventTarget.prototype.removeEventListener;
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        listeners.get(this)?.get(type)?.add(listener);
        return addEventListener.call(this, type, listener, options);
      };
      EventTarget.prototype.removeEventListener = function(type, listener, options) {
        listeners.get(this)?.get(type)?.delete(listener);
        return removeEventListener.call(this, type, listener, options);
      };
      let ground;
      let passes = 0;
      let moves = 0;

      function assert(value, message) {
        if (!value) throw new Error(message);
        passes++;
      }

      function create(config = {}, targets = { board, hands: { top, bottom } }) {
        ground?.destroy();
        for (const el of [board, top, bottom]) el.replaceChildren();
        moves = 0;
        ground = Shogiground({
          sfen: { board: '9/9/9/9/9/9/4P4/9/9', hands: 'Pp' },
          animation: { enabled: false },
          events: { move: () => { moves++; report(); } },
          ...config,
        }, targets);
        return ground;
      }

      function checkObservers() {
        const els = ground.state.dom.elements;
        const expected = [els.board?.board, els.hands?.top, els.hands?.bottom].filter(Boolean);
        assert(observed.size === expected.length && expected.every(el => observed.has(el)),
          'only current elements are observed');
      }

      function contextMenu(el) {
        return !el.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
      }

      function checkListeners() {
        const count = ground.state.viewOnly ? 0 : 1;
        assert(documentEvents.every(type => listeners.get(document).get(type).size === count) &&
          listeners.get(window).get('resize').size === count &&
          listeners.get(document.body).get('shogiground.resize').size ===
            ('ResizeObserver' in window ? 0 : 1), 'document handlers match the mode without duplicates');
      }

      function checkDrawingEvents() {
        const bounds = ground.state.dom.bounds.board.bounds();
        startDrawing(ground.state, new MouseEvent('mousedown', {
          clientX: bounds.x + bounds.width / 2, clientY: bounds.y + bounds.height / 2,
        }));
        document.dispatchEvent(new MouseEvent('mousemove', {
          clientX: bounds.x + 10, clientY: bounds.y + 10,
        }));
        assert(ground.state.drawable.current.pos[0] === bounds.x + 10,
          'document movement follows enabling interaction');
        document.dispatchEvent(new MouseEvent('mouseup'));
        assert(!ground.state.drawable.current, 'document release ends drawing after enabling interaction');
      }

      function report() {
        const s = ground.state;
        interaction.textContent = `Position: ${ground.getBoardSfen()} | hands: ${ground.getHandsSfen()} | moves: ${moves} | shapes: ${s.drawable.shapes.length} | dragging: ${!!s.draggable.current} | drawing: ${!!s.drawable.current} | forced: ${s.drawable.forced} | viewOnly: ${s.viewOnly}`;
      }

      function run() {
        passes = 0;
        results.textContent = '';
        try {
          for (const viewOnly of [false, true]) {
            create({ viewOnly });
            checkListeners();
            for (const next of [!viewOnly, viewOnly, !viewOnly, viewOnly]) {
              const pieces = ground.state.dom.elements.board.pieces;
              ground.set({ viewOnly: next, turnColor: 'gote' });
              assert(ground.state.viewOnly === next && ground.state.turnColor === 'gote',
                'viewOnly applies with other updates');
              assert(ground.state.dom.elements.board.pieces !== pieces, 'changing viewOnly rebuilds');
              assert(board.classList.contains('manipulable') === !next &&
                !!ground.state.dom.elements.board.dragged === !next &&
                top.classList.contains('manipulable') === !next, 'interaction DOM matches viewOnly');
              checkListeners();
              checkObservers();
              if (!next) checkDrawingEvents();
              const samePieces = ground.state.dom.elements.board.pieces;
              ground.set({ viewOnly: next });
              assert(ground.state.dom.elements.board.pieces === samePieces, 'unchanged viewOnly does not rebuild');
              ground.attach({ board });
              checkListeners();
            }
            const pieces = ground.state.dom.elements.board.pieces;
            ground.set({ viewOnly, turnColor: 'gote' });
            ground.set({ viewOnly: undefined });
            assert(ground.state.viewOnly === viewOnly && ground.state.dom.elements.board.pieces === pieces,
              'unchanged and undefined viewOnly are harmless');
            ground.setShapes([{ orig: '5e', dest: '5e', brush: 'primary' }]);
            for (const enabled of [false, true, false, true]) {
              ground.set({ coordinates: { enabled }, drawable: { visible: enabled } });
              assert(board.querySelectorAll('coords').length === (enabled ? 2 : 0), 'coordinates toggle');
              assert(!!board.querySelector('svg.sg-shapes') === enabled, 'drawing layers toggle');
              ground.state.dom.redrawNow();
              assert(!!board.querySelector('svg.sg-shapes ellipse') === enabled, 'existing shapes hide and reappear');
              checkObservers();
            }
            const currentBoard = ground.state.dom.elements.board.board;
            ground.set({ coordinates: { enabled: true }, drawable: { visible: true } });
            ground.set({ turnColor: 'sente' });
            assert(ground.state.dom.elements.board.board === currentBoard, 'unchanged or omitted values do not rebuild');
          }

          for (const targets of [{}, { hands: { top, bottom } }]) {
            create({ viewOnly: true }, targets);
            ground.set({ viewOnly: false });
            checkListeners();
            ground.attach({ board });
            checkObservers();
            checkDrawingEvents();
            ground.detach({ board: true, hands: { top: true, bottom: true } });
            ground.set({ viewOnly: true });
            checkListeners();
            checkObservers();
          }

          ground.destroy();
          delete window.ResizeObserver;
          create({ viewOnly: true });
          for (const viewOnly of [false, true, false]) {
            ground.set({ viewOnly });
            checkListeners();
            if (!viewOnly) checkDrawingEvents();
          }
          ground.destroy();
          assert([...listeners.values()].every(types => [...types.values()].every(set => set.size === 0)),
            'destroy removes document handlers including the resize fallback');
          window.ResizeObserver = TrackingResizeObserver;

          create();
          ground.set({ coordinates: { files: 'japanese', ranks: 'engine' }, squareRatio: [1, 2] });
          assert(board.querySelector('svg.sg-shapes').getAttribute('viewBox') === '-0.5 -1 9 18',
            'squareRatio updates the SVG view box');
          assert(board.querySelector('coords.files').textContent.includes('一'), 'file notation updates');
          assert(board.querySelector('coords.ranks').textContent.includes('a'), 'rank notation updates');
          const squareBoard = ground.state.dom.elements.board.board;
          ground.set({ squareRatio: [1, 2] });
          assert(ground.state.dom.elements.board.board === squareBoard, 'equal square ratios do not rebuild');
          ground.state.dom.bounds.board.bounds();
          const oldBounds = ground.state.dom.bounds.hands.bounds();
          const oldPieceBounds = ground.state.dom.bounds.hands.pieceBounds();

          for (const inlined of [true, false, true, false]) {
            ground.set({ hands: { inlined } });
            for (const [pos, target] of [['top', top], ['bottom', bottom]]) {
              const hand = ground.state.dom.elements.hands[pos];
              assert((inlined ? board : target).contains(hand), 'hands use the requested layout');
              assert(target.querySelectorAll('sg-hand').length === (inlined ? 0 : 1), 'no stale external hands');
              assert(ground.state.dom.wrapElements.hands[pos] === target, 'external targets are retained');
            }
            ground.set({ orientation: 'gote', hands: { roles: ['pawn'] } });
            ground.toggleOrientation();
            checkObservers();
          }
          assert(ground.state.dom.bounds.hands.bounds() !== oldBounds &&
            ground.state.dom.bounds.hands.pieceBounds() !== oldPieceBounds, 'rebuilds invalidate hand bounds');
          for (const viewOnly of [true, false, true, false]) {
            ground.set({ viewOnly, hands: { inlined: !ground.state.hands.inlined } });
            checkListeners();
            checkObservers();
            assert(ground.state.dom.elements.hands.top.parentElement.classList.contains('manipulable') === !viewOnly,
              'hand interaction follows simultaneous mode and layout changes');
          }
          ground.set({ hands: { inlined: true } });
          const replacement = document.createElement('div');
          ground.attach({ hands: { top: replacement } });
          ground.set({ hands: { inlined: false } });
          assert(replacement.contains(ground.state.dom.elements.hands.top), 'attach updates remembered external targets');
          ground.set({ hands: { inlined: true } });
          ground.detach({ hands: { top: true } });
          ground.set({ hands: { inlined: false } });
          assert(!ground.state.dom.elements.hands.top && bottom.contains(ground.state.dom.elements.hands.bottom),
            'detach forgets only the requested external target');

          let inserted;
          create({ hands: { inlined: true }, events: { insert: (_, hands) => { inserted = hands; } } }, { board });
          assert(inserted.top === ground.state.dom.elements.hands.top &&
            inserted.bottom === ground.state.dom.elements.hands.bottom, 'insert reports generated inline hands');
          ground.set({ hands: { inlined: false } });
          assert(!ground.state.dom.elements.hands.top && !ground.state.dom.elements.hands.bottom,
            'no external targets leaves hands unattached');
          ground.attach({ hands: { bottom } });
          assert(bottom.contains(ground.state.dom.elements.hands.bottom), 'late hand attachment works');

          create({}, { hands: { top, bottom } });
          ground.set({ hands: { inlined: true } });
          assert(!ground.state.dom.elements.hands.top && !top.querySelector('sg-hand'),
            'inline mode without a board removes external hands');
          ground.set({ coordinates: { enabled: false }, hands: { inlined: false } });
          assert(top.contains(ground.state.dom.elements.hands.top), 'detached board updates restore external hands');
          ground.attach({ board });
          assert(!board.querySelector('coords'), 'late board attachment uses updated config');
          ground.set({ hands: { inlined: true } });
          ground.detach({ board: true });
          checkObservers();
          assert(!ground.state.dom.elements.hands.top, 'detaching board detaches its inline hands');
          ground.attach({ board });
          ground.set({ hands: { inlined: false } });
          assert(top.contains(ground.state.dom.elements.hands.top), 'board detach preserves external targets');

          create({ disableContextMenu: false, drawable: { enabled: false } });
          const pieces = ground.state.dom.elements.board.pieces;
          for (const [disableContextMenu, enabled] of [[true, false], [false, false], [false, true], [false, false]]) {
            ground.set({ disableContextMenu, drawable: { enabled } });
            assert(ground.state.dom.elements.board.pieces === pieces, 'context menu options do not rebuild');
            for (const el of [pieces, ground.state.dom.elements.hands.top])
              assert(contextMenu(el) === (disableContextMenu || enabled), 'context menu follows current settings');
            assert(contextMenu(ground.state.dom.elements.board.promotion) === disableContextMenu,
              'promotion context menu follows current settings');
          }
          ground.destroy();
          assert(observed.size === 0, 'destroy disconnects observers');
          assert([...listeners.values()].every(types => [...types.values()].every(set => set.size === 0)),
            'destroy removes all document handlers');

          for (const viewOnly of [true, false]) {
            create({ viewOnly });
            const boardElement = ground.state.dom.elements.board.board;
            ground.destroy();
            ground.set({ viewOnly: !viewOnly, coordinates: { enabled: false } });
            ground.set({ turnColor: 'gote' });
            assert([...listeners.values()].every(types => [...types.values()].every(set => set.size === 0)),
              'updates after destroy do not reinstall document handlers');
            assert(observed.size === 0, 'updates after destroy do not reconnect observers');
            assert(ground.state.dom.elements.board.board === boardElement,
              'updates after destroy do not rebuild DOM');
            assert(ground.state.dom.destroyed && ground.state.viewOnly === viewOnly &&
              ground.state.coordinates.enabled && ground.state.turnColor === 'sente',
              'updates after destroy do not change state');
          }

          create({
            activeColor: 'sente',
            turnColor: 'gote',
            promotion: { promotesTo: () => 'tokin', movePromotionDialog: () => true },
          });
          const dragBounds = ground.state.dom.bounds.board.bounds();
          const x = dragBounds.left + dragBounds.width / 2;
          const origY = dragBounds.top + dragBounds.height * 6.5 / 9;
          const destY = dragBounds.top + dragBounds.height * 5.5 / 9;
          startDragging(ground.state, new MouseEvent('mousedown', { clientX: x, clientY: origY }));
          assert(!!ground.state.draggable.current, 'drag starts during opponent turn');
          ground.set({ sfen: { board: '9/9/9/9/9/9/4P4/9/9' }, turnColor: 'sente' });
          assert(!!ground.state.draggable.current && ground.state.selected === '5g',
            'position update preserves active drag and selection');
          document.dispatchEvent(new MouseEvent('mouseup', { clientX: x, clientY: destY }));
          assert(!!ground.state.promotion.current, 'continued drag opens normal move promotion');
          ground.state.dom.redrawNow();
          ground.state.dom.elements.board.promotion.querySelector('piece').click();
          assert(ground.state.pieces.get('5f')?.role === 'tokin' && !ground.state.pieces.has('5g'),
            'continued drag completes promoted normal move');
          assert(!ground.state.premovable.current, 'continued drag does not queue a premove');

          for (const dragged of [false, true]) {
            create({
              activeColor: 'sente', turnColor: 'gote',
              premovable: { generate: () => ['5f'] },
              promotion: { promotesTo: () => 'tokin', movePromotionDialog: () => true },
            });
            if (dragged) {
              const bounds = ground.state.dom.bounds.board.bounds();
              startDragging(ground.state, new MouseEvent('mousedown', {
                clientX: bounds.left + bounds.width / 2,
                clientY: bounds.top + bounds.height * 6.5 / 9,
              }));
              document.dispatchEvent(new MouseEvent('mouseup', {
                clientX: bounds.left + bounds.width / 2,
                clientY: bounds.top + bounds.height * 5.5 / 9,
              }));
            } else {
              ground.selectSquare('5g');
              assert(promotionDialogMove(ground.state, '5g', '5f'), 'premove promotion starts');
            }
            const pending = ground.state.promotion.current;
            assert(!!pending && pending.dragged === dragged, 'premove dialog is pending');
            ground.set({ sfen: { board: 'p8/9/9/9/9/9/4P4/9/9' }, turnColor: 'sente' });
            assert(ground.state.promotion.current === pending && ground.state.selected === '5g',
              'unchanged piece preserves pending promotion across turn update');
            ground.state.dom.redrawNow();
            ground.state.dom.elements.board.promotion.querySelector('piece').click();
            assert(ground.state.pieces.get('5f')?.role === 'tokin' && !ground.state.pieces.has('5g'),
              'premove promotion completes as normal move');
            assert(!ground.state.premovable.current, 'accepted promotion does not queue a premove');
          }

          for (const skipAnimation of [false, true]) {
            for (const replacement of ['9/9/9/9/9/9/4R4/9/9', '9/9/9/9/9/9/4p4/9/9', '9/9/9/9/9/9/9/9/9']) {
              create({
                promotion: {
                  promotesTo: role => ({ pawn: 'tokin', rook: 'dragon' })[role],
                  movePromotionDialog: () => true,
                },
                animation: { enabled: true },
              });
              ground.selectSquare('5g');
              assert(promotionDialogMove(ground.state, '5g', '5f'), 'replacement promotion dialog starts');
              ground.state.dom.redrawNow();
              const promotion = ground.state.dom.elements.board.promotion;
              const choice = promotion.querySelector('piece');
              assert(choice.sgRole === 'tokin', 'dialog offers pawn promotion');
              const pieces = ground.state.dom.elements.board.pieces;
              ground.set({ sfen: { board: replacement } }, skipAnimation);
              ground.state.dom.redrawNow();
              assert(ground.state.dom.elements.board.pieces === pieces, 'same dimensions do not rebuild');
              // A queued click on the old choice must not act on the replacement piece.
              choice.dispatchEvent(new MouseEvent('click', { bubbles: true }));
              assert(ground.getBoardSfen() === replacement, 'stale promotion click leaves replacement intact');
              assert(!ground.state.promotion.current && !ground.state.selected && !ground.state.selectedPiece,
                'position replacement clears promotion and selection');
              assert(promotion.style.display === 'none', 'position replacement hides promotion dialog');
            }
          }

          create({ promotion: { promotesTo: () => 'tokin', movePromotionDialog: () => true } });
          ground.selectSquare('5g');
          assert(promotionDialogMove(ground.state, '5g', '5f'), 'promotion dialog starts');
          ground.set({ coordinates: { enabled: false } });
          assert(!ground.state.promotion.current && !board.querySelector('sg-promotion.active'),
            'rebuild cancels promotion');
          const bounds = ground.state.dom.bounds.board.bounds();
          startDrawing(ground.state, new MouseEvent('mousedown', {
            clientX: bounds.x + bounds.width / 2, clientY: bounds.y + bounds.height / 2,
          }));
          assert(!!ground.state.drawable.current, 'drawing starts');
          ground.set({ drawable: { enabled: false } });
          assert(!ground.state.drawable.current, 'disabling drawing cancels the active gesture');
          results.textContent = `PASS: ${passes} assertions. Use the board to test real dragging and drawing.\n`;
          create({ viewOnly: true });
          report();
        } catch (e) {
          results.textContent = `FAIL after ${passes} assertions: ${e.stack}`;
          throw e;
        }
      }

      document.querySelector('#run').onclick = run;
      document.querySelector('#reset').onclick = () => { create({ viewOnly: true }); report(); };
      document.querySelector('#draw').onclick = () => {
        ground.set({ drawable: { forced: !ground.state.drawable.forced } });
        report();
      };
      document.querySelector('#inline').onclick = () => {
        ground.set({ hands: { inlined: !ground.state.hands.inlined } });
        report();
      };
      document.querySelector('#view-only').onclick = () => {
        ground.set({ viewOnly: !ground.state.viewOnly });
        checkListeners();
        checkObservers();
        report();
      };
      document.querySelector('#interrupt').onclick = () => {
        board.addEventListener('mousedown', () => {
          setTimeout(() => {
            const s = ground.state;
            const active = !!(s.draggable.current || s.drawable.current);
            ground.set({ viewOnly: true });
            results.textContent += `Interrupted active gesture: ${active}; cleared: ${!s.draggable.current && !s.drawable.current && !s.promotion.current}\n`;
            report();
          }, 30);
        }, { once: true, capture: true });
      };
      addEventListener.call(document, 'mouseup', () => setTimeout(report, 0));
      run();
    </script>
  </body>
</html>
